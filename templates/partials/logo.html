{#
  Logo als JPEG. Da JPEG keine Transparenz kennt, gibt es zwei Dateien
  mit passendem Hintergrund; das Farbschema entscheidet über die Variante.
  Beide Dateien werden mit tools/export-logo.mjs erzeugt.
#}
{% macro logo(size, css_class='brand__mark', alt='') -%}
<picture class="logo">
  <source srcset="{{ url_for('static', filename='img/logo-dark.jpg') }}"
          media="(prefers-color-scheme: dark)" type="image/jpeg">
  <img class="{{ css_class }}"
       src="{{ url_for('static', filename='img/logo.jpg') }}"
       alt="{{ alt }}"
       width="{{ size }}" height="{{ size }}"
       {% if not alt %}aria-hidden="true"{% endif %}
       decoding="async">
</picture>
{%- endmacro %}
